<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ilham</title>
  <meta name="description" content="Ilham — your private AI companion, running on your own PC.">
  <meta name="theme-color" content="#0b0a12">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3CradialGradient id='g'%3E%3Cstop offset='0' stop-color='%23ff7eb6'/%3E%3Cstop offset='1' stop-color='%238b5cf6'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='15' fill='url(%23g)'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="stage">
    <!-- Ilham's face -->
    <section class="face-pane">
      <canvas id="face" aria-label="Ilham's face"></canvas>
      <video id="cam" playsinline muted hidden></video>
      <div class="mood-badge" id="moodBadge" title="How Ilham feels right now">neutral</div>
      <div class="cam-dot" id="camDot" hidden title="Camera is on — Ilham can see you">● seeing you</div>
      <div class="model-pill" id="modelPill">connecting…</div>
    </section>

    <!-- Conversation -->
    <section class="chat-pane">
      <header class="chat-head">
        <strong>Ilham</strong>
        <span class="muted" id="headerSub">your companion</span>
        <div class="head-actions">
          <button class="icon-btn" id="btnMic" title="Talk to her (voice)" aria-pressed="false">🎙️</button>
          <button class="icon-btn" id="btnCam" title="Let her see you (webcam)" aria-pressed="false">📷</button>
          <button class="icon-btn" id="btnSpeak" title="Her voice on/off" aria-pressed="true">🔊</button>
          <button class="icon-btn" id="btnSettings" title="Settings">⚙️</button>
        </div>
      </header>

      <div class="guardian-bar" id="guardianBar" hidden></div>
      <div class="messages" id="messages" aria-live="polite"></div>

      <form class="composer" id="composer">
        <input id="input" type="text" autocomplete="off" placeholder="Kuch bhi kaho…" aria-label="Message to Ilham">
        <button class="send" type="submit" aria-label="Send">➤</button>
      </form>
    </section>
  </div>

  <!-- Settings drawer -->
  <div class="drawer-scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" hidden aria-label="Settings">
    <div class="drawer-head"><strong>Settings</strong><button class="icon-btn" id="btnCloseDrawer">✕</button></div>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>

  <script type="module" src="app.js"></script>
</body>
</html>
